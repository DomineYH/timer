<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 활동 타이머</title>
  <style>
    /* 기본 여백 제거 및 전체 레이아웃 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f0f4f8;
      color: #2d3748;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* 카드 형태의 메인 박스 */
    .timer-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 580px;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 상단: 활동 이름 표시 영역 */
    .top-section {
      width: 100%;
      margin-bottom: 12px;
    }

    .activity-display {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      color: #3182ce;
      word-break: keep-all;
      line-height: 1.3;
    }

    /* 가운데: 대형 타이머 숫자 영역 */
    .time-section {
      width: 100%;
      margin: 16px 0;
    }

    .time-display {
      font-size: clamp(4rem, 16vw, 7.5rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #1a202c;
      letter-spacing: -2px;
    }

    /* 0초 종료 시 시각 효과 */
    .time-display.finished {
      color: #e53e3e;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    .status-message {
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #718096;
      margin-top: 4px;
    }

    .status-message.finished {
      color: #e53e3e;
      font-size: 1.25rem;
    }

    /* 하단: 설정 및 입력 영역 */
    .control-section {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #f7fafc;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    .input-label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #4a5568;
    }

    input[type="text"], input[type="number"] {
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #3182ce;
    }

    input[type="text"] {
      width: 100%;
      max-width: 280px;
    }

    input[type="number"] {
      width: 72px;
      text-align: center;
    }

    /* 모바일에서도 겹치지 않는 반응형 버튼 */
    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start {
      background-color: #3182ce;
      color: #ffffff;
    }

    .btn-pause {
      background-color: #ed8936;
      color: #ffffff;
    }

    .btn-reset {
      background-color: #e2e8f0;
      color: #4a5568;
    }

    .notice {
      font-size: 0.82rem;
      color: #a0aec0;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="timer-card">
    <!-- 상단: 활동 이름 -->
    <header class="top-section">
      <h1 id="activityDisplay" class="activity-display">즐거운 활동 시간</h1>
    </header>

    <!-- 가운데: 크게 표시한 남은 시간 -->
    <main class="time-section">
      <div id="timeDisplay" class="time-display">05:00</div>
      <div id="statusMessage" class="status-message">준비 중</div>
    </main>

    <!-- 하단: 분·초 입력, 조작 버튼 -->
    <footer class="control-section">
      <div class="input-group">
        <div class="input-row">
          <label for="activityInput" class="input-label">활동명</label>
          <input type="text" id="activityInput" value="즐거운 활동 시간" maxlength="30" placeholder="활동 이름을 적어주세요">
        </div>
        <div class="input-row">
          <label for="minInput" class="input-label">분</label>
          <input type="number" id="minInput" value="5" min="0" max="180">
          <label for="secInput" class="input-label">초</label>
          <input type="number" id="secInput" value="0" min="0" max="59">
        </div>
      </div>

      <div class="button-group">
        <button type="button" id="startBtn" class="btn btn-start">시작</button>
        <button type="button" id="pauseBtn" class="btn btn-pause">일시정지</button>
        <button type="button" id="resetBtn" class="btn btn-reset">초기화</button>
      </div>

      <p class="notice">※ 새로고침하면 설정한 내용이 사라집니다 (브라우저 메모리 보관용).</p>
    </footer>
  </div>

  <script>
    // --- [1. 브라우저 메모리 변수] ---
    let initialTotalSeconds = 300; // 마지막으로 정상 시작된 설정 시간(초)
    let remainingSeconds = 300;    // 현재 남은 시간(초)
    let targetEndTime = null;       // 종료 시점 타임스탬프
    let timerIntervalId = null;     // 인터벌 타이머 ID
    let isRunning = false;          // 실행 중 여부
    let isPaused = false;           // 일시정지 상태 여부

    // --- [2. DOM 요소 연결] ---
    const activityDisplay = document.getElementById('activityDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const statusMessage = document.getElementById('statusMessage');

    const activityInput = document.getElementById('activityInput');
    const minInput = document.getElementById('minInput');
    const secInput = document.getElementById('secInput');

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    // 시간 출력 포맷 함수 (안전한 textContent 사용)
    function formatTime(totalSec) {
      const safeSec = Math.max(0, Math.floor(totalSec));
      const m = Math.floor(safeSec / 60);
      const s = safeSec % 60;
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      return `${mm}:${ss}`;
    }

    function updateTimeDisplay(seconds) {
      timeDisplay.textContent = formatTime(seconds);
    }

    // 입력창 잠금/해제
    function setInputsDisabled(disabled) {
      activityInput.disabled = disabled;
      minInput.disabled = disabled;
      secInput.disabled = disabled;
    }

    // ★ [실시간 입력 감지] 분·초를 변경하면 화면 숫자를 즉시 갱신하고 이전 일시정지 기억을 해제
    function handleTimeInputChange() {
      if (isRunning) return;

      // 시간을 새로 만지면 일시정지 상태를 풀고 새로운 타이머 준비 상태로 전환
      isPaused = false;

      timeDisplay.classList.remove('finished');
      statusMessage.classList.remove('finished');
      statusMessage.textContent = '시간 설정 중...';

      const m = parseInt(minInput.value, 10);
      const s = parseInt(secInput.value, 10);

      const validM = (!isNaN(m) && m >= 0) ? m : 0;
      const validS = (!isNaN(s) && s >= 0) ? s : 0;

      // 0분 0초를 적으면 큰 화면에도 즉시 00:00이 표시되어 이전 시간으로 튀지 않음
      updateTimeDisplay((validM * 60) + validS);
    }

    minInput.addEventListener('input', handleTimeInputChange);
    secInput.addEventListener('input', handleTimeInputChange);

    activityInput.addEventListener('input', () => {
      const cleanName = activityInput.value.trim();
      activityDisplay.textContent = cleanName !== '' ? cleanName : '우리 반 활동 시간';
    });

    // --- [3. 타이머 핵심 동작] ---

    // 0.25초마다 실제 경과 시간을 대조하여 백그라운드 탭 딜레이 방지
    function startIntervalLoop() {
      if (timerIntervalId) clearInterval(timerIntervalId);

      timerIntervalId = setInterval(() => {
        const now = Date.now();
        const diffInSeconds = Math.ceil((targetEndTime - now) / 1000);

        if (diffInSeconds <= 0) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
          remainingSeconds = 0;
          isRunning = false;
          isPaused = false;

          updateTimeDisplay(0);
          timeDisplay.classList.add('finished');
          statusMessage.textContent = '🔔 활동이 종료되었습니다!';
          statusMessage.classList.add('finished');
          setInputsDisabled(false);
        } else {
          remainingSeconds = diffInSeconds;
          updateTimeDisplay(remainingSeconds);
        }
      }, 250);
    }

    // [시작 버튼 클릭]
    startBtn.addEventListener('click', () => {
      // 1) 이미 돌아가는 중이면 연타 방지
      if (isRunning) {
        return;
      }

      // 2) 시간을 수정하지 않고 순수하게 일시정지만 풀고 다시 갈 때
      if (isPaused) {
        isRunning = true;
        isPaused = false;
        targetEndTime = Date.now() + (remainingSeconds * 1000);
        statusMessage.textContent = '진행 중...';
        statusMessage.classList.remove('finished');
        timeDisplay.classList.remove('finished');
        setInputsDisabled(true);
        startIntervalLoop();
        return;
      }

      // 3) 새로 시작하는 경우: 빈칸 검사
      const minText = minInput.value.trim();
      const secText = secInput.value.trim();

      if (minText === '' || secText === '') {
        alert('분과 초를 모두 입력해 주세요.');
        return;
      }

      const min = Number(minText);
      const sec = Number(secText);

      // 음수, 소수점, 문자 검사
      if (isNaN(min) || isNaN(sec) || !Number.isInteger(min) || !Number.isInteger(sec)) {
        alert('시간은 올바른 정수 숫자로 입력해 주세요.');
        return;
      }

      if (min < 0 || sec < 0) {
        alert('시간에 음수는 입력할 수 없습니다.');
        return;
      }

      if (sec >= 60) {
        alert('초는 0초부터 59초 사이로 입력해 주세요.');
        return;
      }

      // ★ [선생님 요청 반영] 0분 0초일 때 경고창을 띄우고 이전 시간으로 가지 않음 ★
      if (min === 0 && sec === 0) {
        alert('0분 0초로는 시작할 수 없습니다. 1초 이상의 시간을 설정해 주세요.');
        updateTimeDisplay(0); // 00:00 상태 고정
        statusMessage.textContent = '⚠️ 0분 0초는 시작할 수 없습니다.';
        statusMessage.classList.remove('finished');
        return;
      }

      const totalSec = (min * 60) + sec;
      initialTotalSeconds = totalSec;
      remainingSeconds = totalSec;

      const cleanName = activityInput.value.trim();
      activityDisplay.textContent = cleanName !== '' ? cleanName : '우리 반 활동 시간';

      isRunning = true;
      isPaused = false;
      targetEndTime = Date.now() + (remainingSeconds * 1000);

      timeDisplay.classList.remove('finished');
      statusMessage.classList.remove('finished');
      statusMessage.textContent = '진행 중...';
      updateTimeDisplay(remainingSeconds);
      setInputsDisabled(true);

      startIntervalLoop();
    });

    // [일시정지 버튼 클릭]
    pauseBtn.addEventListener('click', () => {
      if (!isRunning) return;

      clearInterval(timerIntervalId);
      timerIntervalId = null;

      const now = Date.now();
      remainingSeconds = Math.max(0, Math.ceil((targetEndTime - now) / 1000));

      isRunning = false;
      isPaused = true;

      updateTimeDisplay(remainingSeconds);
      statusMessage.textContent = '⏸️ 일시정지 중';
      setInputsDisabled(false);
    });

    // [초기화 버튼 클릭]
    resetBtn.addEventListener('click', () => {
      const confirmed = confirm('처음 설정한 시간으로 되돌릴까요?');
      if (!confirmed) return;

      if (timerIntervalId) {
        clearInterval(timerIntervalId);
        timerIntervalId = null;
      }

      isRunning = false;
      isPaused = false;
      remainingSeconds = initialTotalSeconds;

      // 입력창 숫자도 처음 설정한 시간으로 함께 복원
      minInput.value = Math.floor(initialTotalSeconds / 60);
      secInput.value = initialTotalSeconds % 60;

      updateTimeDisplay(remainingSeconds);
      timeDisplay.classList.remove('finished');
      statusMessage.classList.remove('finished');
      statusMessage.textContent = '초기화되었습니다.';
      setInputsDisabled(false);
    });
  </script>
</body>
</html>
